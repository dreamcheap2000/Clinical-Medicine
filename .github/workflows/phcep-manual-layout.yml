name: PHCEP manual layout deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY (required even for dry run)
        required: true
        type: string
      dry_run:
        description: Read-only preflight; never upload code or migrate
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: phcep-production-12ksl5GvgM_YVc1NjrPE9LRe_YvUgqttLl0R41z5dazo
  cancel-in-progress: false

jobs:
  manual-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Guard before checkout or secrets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          blockers = []
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              blockers.append("MAIN_ONLY")
          if os.environ.get("CONFIRMATION") != "APPLY":
              blockers.append("CONFIRMATION_REQUIRED")
          if os.environ.get("DRY_RUN", "true") not in ("true", "false"):
              blockers.append("INVALID_DRY_RUN")
          mode = "dry_run" if os.environ.get("DRY_RUN", "true") == "true" else "apply"
          report = {"mode": mode, "commit": os.environ["GITHUB_SHA"],
                    "status": "failed", "stages": [] if blockers else ["guards"],
                    "planned": None, "actual": None,
                    "before": None, "after": None,
                    "blockers": blockers or ["TESTS_OR_RUNNER_NOT_COMPLETED"]}
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "phcep-report.json"
          path.write_text(json.dumps(report, indent=2) + "\n")
          path.chmod(0o600)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("PHCEP guard: " + (", ".join(blockers) if blockers else "passed") + "\n\n")
          if blockers:
              raise SystemExit(1)
          PY

      - name: Checkout guarded main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Local safety tests (no Google access)
        run: |
          node --test PHCEP/tests/*.test.cjs
          npm --prefix PHCEP/gateway test
          python3 -m unittest scripts.test_write_clasp_credentials scripts.test_phcep_manual_deploy

      - name: PHCEP read-only preflight and optional apply
        env:
          PHCEP_CONFIRMATION: ${{ inputs.confirmation }}
          PHCEP_DRY_RUN: ${{ inputs.dry_run }}
          PHCEP_SCRIPT_ID: ${{ vars.PHCEP_SCRIPT_ID }}
          PHCEP_EXPECTED_SCRIPT_ID: ${{ vars.PHCEP_EXPECTED_SCRIPT_ID }}
          PHCEP_SPREADSHEET_ID: ${{ vars.PHCEP_SPREADSHEET_ID }}
          PHCEP_OAUTH_CLIENT_ID: ${{ vars.PHCEP_OAUTH_CLIENT_ID }}
          PHCEP_PREFLIGHT_SOURCE_SHA256: ${{ vars.PHCEP_PREFLIGHT_SOURCE_SHA256 }}
          PHCEP_CLASPRC_JSON: ${{ secrets.PHCEP_CLASPRC_JSON }}
          PHCEP_REPORT_PATH: ${{ runner.temp }}/phcep-report.json
        run: python3 -m scripts.phcep_manual_deploy

      - name: Always summarize known outcome
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "phcep-report.json"
          if path.exists():
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\nFinal sanitized report:\n\n```json\n")
                  summary.write(path.read_text())
                  summary.write("```\n")
          PY

      - name: Upload sanitized report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phcep-manual-layout-report
          path: ${{ runner.temp }}/phcep-report.json
          retention-days: 3
          if-no-files-found: warn

      - name: Clean up ephemeral report
        if: always()
        run: rm -f -- "$RUNNER_TEMP/phcep-report.json"
