name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - apps-script/**
      - .github/workflows/deploy-apps-script.yml
      - scripts/validate_apps_script_response.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install clasp
        run: npm install -g @google/clasp

      # ✅ Only keep ONE credentials step
      - name: Setup Clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Verify JSON format
        run: |
          grep '"token"' ~/.clasprc.json || (echo "Wrong format: missing token block" && exit 1)

      - name: Write .clasp.json
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          cat > apps-script/.clasp.json <<JSON
          {
            "scriptId": "${CLASP_SCRIPT_ID}",
            "rootDir": "."
          }
          JSON

      - name: Run similarity tests
        working-directory: apps-script
        run: npm test

      - name: Deploy Apps Script
        working-directory: apps-script
        env:
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: |
          clasp push -f
          clasp deploy -i $CLASP_DEPLOYMENT_ID

      - name: Smoke test deployed web app
        env:
          GS_WEBAPP_SECRET: ${{ secrets.GS_WEBAPP_SECRET }}
          GS_WEBAPP_URL: ${{ secrets.GS_WEBAPP_URL }}
        run: |
          umask 077
          response_file=$(mktemp)
          curl --silent --show-error --fail --get \
            --data-urlencode "action=health" \
            --data-urlencode "secret=${GS_WEBAPP_SECRET}" \
            "$GS_WEBAPP_URL" > "$response_file"
          python scripts/validate_apps_script_response.py \
            --input "$response_file" \
            --expected-status ok \
            --require-key qaCount \
            --require-key threshold
