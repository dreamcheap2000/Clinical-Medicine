name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - apps-script/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const raw = process.env.CLASPRC_JSON || '';
          if (!raw.trim()) {
            throw new Error('CLASPRC_JSON is empty or not set');
          }

          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch (error) {
            throw new Error(`CLASPRC_JSON is not valid JSON: ${error.message}`);
          }
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            throw new Error('CLASPRC_JSON must be a JSON object');
          }

          const hasUsableToken = (token) =>
            token &&
            typeof token === 'object' &&
            !Array.isArray(token) &&
            (typeof token.access_token === 'string' || typeof token.refresh_token === 'string');

          let normalized = parsed;

          // Support both current and legacy ~/.clasprc.json formats.
          if (!parsed.token) {
            if (!hasUsableToken(parsed)) {
              throw new Error(
                'CLASPRC_JSON legacy format must include access_token or refresh_token at the top level'
              );
            }
            const { oauth2ClientSettings = {}, isLocalCreds, ...token } = parsed;
            normalized = { token, oauth2ClientSettings };
            if (typeof isLocalCreds !== 'undefined') {
              normalized.isLocalCreds = isLocalCreds;
            }
          }

          fs.writeFileSync(`${process.env.HOME}/.clasprc.json`, JSON.stringify(normalized));
          NODE

      - name: Write .clasp.json
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          cat > apps-script/.clasp.json <<JSON
          {
            "scriptId": "${CLASP_SCRIPT_ID}",
            "rootDir": "."
          }
          JSON

      - name: Run similarity tests
        working-directory: apps-script
        run: npm test

      - name: Push Apps Script files
        working-directory: apps-script
        run: clasp push -f

      - name: Deploy existing web app
        working-directory: apps-script
        env:
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}"

      - name: Smoke test deployed web app
        env:
          GS_WEBAPP_SECRET: ${{ secrets.GS_WEBAPP_SECRET }}
          GS_WEBAPP_URL: ${{ secrets.GS_WEBAPP_URL }}
        run: |
          response=$(curl --silent --show-error --fail --get \
            --data-urlencode "action=health" \
            --data-urlencode "secret=${GS_WEBAPP_SECRET}" \
            "$GS_WEBAPP_URL")
          echo "$response"
          echo "$response" | grep '"status":"ok"'
