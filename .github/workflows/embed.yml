name: QA Embedding + Sync

on:
  push:
    branches:
      - main
    paths:
      - qa_pairs.json
      - scripts/embed.py
      - .github/workflows/embed.yml
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install embedding dependencies
        run: pip install sentence-transformers pandas

      - name: Generate embeddings
        run: python scripts/embed.py --input qa_pairs.json --output qa_pairs_with_embeddings.json

      - name: Sync QA pairs to Apps Script
        env:
          GS_WEBAPP_SECRET: ${{ secrets.GS_WEBAPP_SECRET }}
          GS_WEBAPP_URL: ${{ secrets.GS_WEBAPP_URL }}
        run: |
          python - <<'PY' > /tmp/qa_sync_payload.json
          import json
          with open('qa_pairs_with_embeddings.json', encoding='utf-8') as f:
              items = json.load(f)
          payload = {
              'action': 'sync_qa',
              'secret': '${{ secrets.GS_WEBAPP_SECRET }}',
              'overwrite': True,
              'items': items,
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY
          curl --silent --show-error --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: ${GS_WEBAPP_SECRET}" \
            --data @/tmp/qa_sync_payload.json \
            "$GS_WEBAPP_URL"
